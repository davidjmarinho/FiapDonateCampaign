apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiapdonatecampaign
  labels:
    app: fiapdonatecampaign
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fiapdonatecampaign
  template:
    metadata:
      labels:
        app: fiapdonatecampaign
    spec:
      containers:
        - name: api
          image: fiapdonatecampaign:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: fiapdonatecampaign-config
            - secretRef:
                name: fiapdonatecampaign-secrets
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3